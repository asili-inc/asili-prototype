<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asili — Clickable prototype</title>
<style>
  :root {
    --primary: #1B7A4B;
    --primary-soft: rgba(27, 122, 75, .10);
    --bg: #F2F5F3;
    --fg: #1A1F1C;
    --muted: #5C6B62;
    --border: #C8D6CE;
    --card: #FFFFFF;
    --font: "Funnel Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font); color: var(--fg); background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden; font-size: 14px;
  }
  button { font-family: inherit; color: inherit; }

  /* ---------- top bar ---------- */
  .topbar {
    flex: 0 0 52px; display: flex; align-items: center; gap: 16px; padding: 0 16px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; }
  .brand .mark {
    width: 28px; height: 28px; border-radius: 9px; background: var(--primary); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 16px;
  }
  .brand b { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
  .brand span { color: var(--muted); font-size: 13px; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; cursor: pointer;
    font-weight: 600; font-size: 13px; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--primary); color: #fff; }
  .spacer { flex: 1; }
  .tbtn {
    border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 14px;
    cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
  }
  .tbtn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .tbtn:disabled { opacity: .4; cursor: default; }
  .tbtn[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  kbd {
    font-family: inherit; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted);
  }

  /* ---------- layout ---------- */
  .main { flex: 1; min-height: 0; display: flex; }
  #proto { flex: 1; min-width: 0; display: flex; }
  body.mode-board #proto { display: none; }
  body:not(.mode-board) #board { display: none; }

  /* ---------- left rail ---------- */
  .rail {
    flex: 0 0 290px; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .rail-next { padding: 12px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
  .rail-next .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .nextchip {
    width: 100%; text-align: left; border: 0; cursor: pointer; padding: 10px 14px; border-radius: 14px;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 13px; line-height: 1.25;
  }
  .nextchip small { display: block; font-weight: 500; opacity: .85; margin-top: 2px; }
  .journeys { flex: 1; overflow-y: auto; padding: 8px 8px 24px; }
  .journey { border-radius: 14px; margin-bottom: 4px; }
  .jhead { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 10px; border-radius: 14px; cursor: pointer; }
  .jhead:hover { background: var(--bg); }
  .journey.open > .jhead { background: var(--bg); }
  .jtitle { flex: 1; font-weight: 700; font-size: 14px; }
  .jtitle small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .jcaret { width: 14px; color: var(--muted); transition: transform .15s; font-size: 11px; }
  .journey.open .jcaret { transform: rotate(90deg); }
  .start {
    border: 1px solid var(--primary); color: var(--primary); background: var(--card); border-radius: 999px;
    font-weight: 700; font-size: 12px; padding: 4px 12px; cursor: pointer;
  }
  .start:hover { background: var(--primary); color: #fff; }
  .jlist { display: none; list-style: none; margin: 4px 0 8px; padding: 0 0 0 6px; }
  .journey.open .jlist { display: block; }
  .jlist button {
    width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer; border-radius: 10px;
    padding: 6px 10px; display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--fg);
  }
  .jlist button:hover { background: var(--bg); }
  .jlist button .num { flex: 0 0 22px; color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .jlist button[aria-current="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
  .jlist button[aria-current="true"] .num { color: var(--primary); }

  /* ---------- stage + phone ---------- */
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 10px; position: relative; }
  .phone-box { position: relative; flex: 0 0 auto; }
  .phone {
    position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 410px; height: 864px; padding: 10px;
    border-radius: 44px; background: #1A1F1C;
    box-shadow: 0 30px 60px -20px rgba(26, 31, 28, .45), 0 0 0 1px rgba(0,0,0,.4) inset;
  }
  .screen { position: relative; width: 390px; height: 844px; border-radius: 34px; overflow: hidden; background: #fff; isolation: isolate; }
  .layer { position: absolute; inset: 0; opacity: 1; transition: opacity .16s ease; background: #fff; }
  .layer.entering { opacity: 0; }
  .scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; }
  .scroller::-webkit-scrollbar { display: none; }
  .canvas { position: relative; width: 390px; }
  .canvas img { display: block; width: 390px; height: 100%; user-select: none; -webkit-user-drag: none;
    image-rendering: auto; image-rendering: -webkit-optimize-contrast; }
  .dock { position: absolute; left: 0; width: 390px; background-repeat: no-repeat; background-size: 390px auto; }
  .dock.top { top: 0; }
  .dock.bottom { bottom: 0; }

  .hs {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer;
    border-radius: 12px; -webkit-tap-highlight-color: transparent;
  }
  .hs:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  .hs:active { background: rgba(27, 122, 75, .14); }
  .hs .t { display: none; }
  body.hs-on .hs {
    background: rgba(27, 122, 75, .20); outline: 1.5px solid rgba(27, 122, 75, .85); outline-offset: -1.5px;
  }
  body.hs-on .hs:hover { background: rgba(27, 122, 75, .34); }
  body.hs-on .hs .t {
    display: block; position: absolute; left: 2px; top: 1px; max-width: calc(100% - 4px); overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; font: 700 9px/1.2 var(--font); color: #0E4E2E;
    background: rgba(255, 255, 255, .8); padding: 1px 4px; border-radius: 4px; pointer-events: none;
  }
  .caption { font-size: 12px; color: var(--muted); display: flex; gap: 12px; align-items: center; min-height: 20px; }
  .caption b { color: var(--fg); }
  .caption .scrolls { color: var(--primary); font-weight: 700; }

  /* ---------- flow board ---------- */
  #board { flex: 1; overflow-y: auto; padding: 24px 28px 64px; }
  .bj { margin-bottom: 36px; }
  .bj h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; }
  .bj h2 small { font-size: 12px; font-weight: 600; color: var(--muted); }
  .brow { display: flex; gap: 20px; overflow-x: auto; padding: 12px 4px 16px; scrollbar-width: thin; }
  .bcard { flex: 0 0 195px; display: flex; flex-direction: column; gap: 8px; }
  .bthumb {
    position: relative; width: 195px; height: 422px; overflow: hidden; border-radius: 22px;
    border: 1px solid var(--border); background: #fff; cursor: pointer; padding: 0; display: block;
    box-shadow: 0 6px 16px -10px rgba(26, 31, 28, .35);
  }
  .bthumb:hover { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
  .bthumb img { display: block; width: 195px; height: auto; }
  .bcard.current .bthumb { box-shadow: 0 0 0 3px var(--primary); border-color: var(--primary); }
  .bthumb .tallbadge {
    position: absolute; right: 8px; bottom: 8px; font-size: 10px; font-weight: 700; color: #fff;
    background: rgba(26, 31, 28, .75); border-radius: 999px; padding: 2px 8px;
  }
  .bname { font-size: 13px; font-weight: 700; line-height: 1.25; display: flex; gap: 8px; align-items: baseline; }
  .bname .num { flex: 0 0 auto; font-size: 11px; color: #fff; background: var(--primary); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 3px 9px; cursor: pointer;
    font-size: 11px; font-weight: 600; color: var(--primary); text-align: left; line-height: 1.3;
  }
  .chip:hover { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip.more { color: var(--muted); cursor: default; border-style: dashed; }
  .chip.more:hover { background: var(--card); color: var(--muted); border-color: var(--border); }
  .chip.end { color: var(--muted); cursor: default; border-style: dashed; }
  .chip.end:hover { background: var(--card); color: var(--muted); border-color: var(--border); }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: #fff;
    padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 900px) { .rail { display: none; } .brand span { display: none; } .brand { min-width: 0; } .keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { .layer { transition: none; } }
</style>
</head>

<header class="topbar">
  <div class="brand"><div class="mark">A</div><b>Asili</b><span>Clickable prototype</span></div>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-proto" aria-pressed="true">Prototype</button>
    <button id="m-board" aria-pressed="false">Flow board <kbd>B</kbd></button>
  </div>
  <div class="spacer"></div>
  <span class="keys" style="color:var(--muted);font-size:12px"><kbd>←</kbd> <kbd>→</kbd> screens &nbsp; <kbd>Esc</kbd> back</span>
  <button class="tbtn" id="btn-back" title="Back (Esc / Backspace)" disabled>← Back</button>
  <button class="tbtn" id="btn-hs" aria-pressed="false" title="Show tappable areas (H)">Hotspots <kbd>H</kbd></button>
</header>

<div class="main">
  <section id="proto">
    <aside class="rail">
      <div class="rail-next">
        <div class="lbl">Next in journey</div>
        <button class="nextchip" id="nextchip">…</button>
      </div>
      <div class="journeys" id="journeys"></div>
    </aside>
    <div class="stage" id="stage">
      <div class="phone-box" id="phonebox">
        <div class="phone" id="phone"><div class="screen" id="screen"></div></div>
      </div>
      <div class="caption" id="caption"></div>
    </div>
  </section>
  <section id="board" aria-label="Flow board"></section>
</div>
<div class="toast" id="toast"></div>

const JOURNEYS = [
  ["guest", "Guest & entry"], ["parent-onboarding", "Parent onboarding"], ["parent-booking", "Parent booking"],
  ["parent-after", "Parent after booking"], ["trainer", "Trainer"], ["admin", "Admin"]
];

/* ---------------------------------------------------------------------
   App
   --------------------------------------------------------------------- */
const $ = (s, el = document) => el.querySelector(s);
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const byFile = new Map(SCREENS.map(s => [s.file, s]));
const indexOf = new Map(SCREENS.map((s, i) => [s.file, i]));
const IMG = f => "./screens/" + f;

let cur = null, hist = [], mode = "proto", lastJourney = null;

/* Load-time assertion: every hotspot target must exist in the manifest. */
(function validateFlow() {
  const errs = []; let count = 0;
  for (const [file, spots] of Object.entries(FLOW)) {
    if (!byFile.has(file)) errs.push(`FLOW key not in manifest: ${file}`);
    const H = TALL[file] ? TALL[file].h : 844;
    spots.forEach((h, i) => {
      count++;
      if (h.to !== "@back" && !byFile.has(h.to)) errs.push(`${file}[${i}] "${h.label}" -> unknown target ${h.to}`);
      if (h.x < 0 || h.y < 0 || h.x + h.w > 390.5 || h.y + h.h > H + 0.5) errs.push(`${file}[${i}] "${h.label}" is outside the ${390}x${H} canvas`);
    });
  }
  for (const [a, b] of Object.entries(NEXT)) if (!byFile.has(a) || !byFile.has(b)) errs.push(`NEXT entry invalid: ${a} -> ${b}`);
  console.assert(errs.length === 0, "[prototype] FLOW validation failed:\n" + errs.join("\n"));
  if (errs.length) errs.forEach(e => console.error("[prototype] " + e));
  else console.log(`[prototype] FLOW OK — ${SCREENS.length} screens, ${count} hotspots, all targets exist in the manifest.`);
  window.__flowErrors = errs; window.__hotspotCount = count;
})();

/* ---------- layer building ---------- */
function buildLayer(s) {
  const t = TALL[s.file];
  const H = t ? t.h : 844;
  const layer = mk("div", "layer");
  const sc = mk("div", "scroller");
  const canvas = mk("div", "canvas");
  canvas.style.height = H + "px";
  const img = new Image();
  img.src = IMG(s.file); img.alt = s.name; img.draggable = false;
  img.onerror = () => console.error("[prototype] missing image " + IMG(s.file));
  canvas.append(img); sc.append(canvas); layer.append(sc);

  let dTop = null, dBot = null;
  if (t && t.dockTop) { dTop = mk("div", "dock top"); dTop.style.height = t.dockTop + "px"; dTop.style.backgroundImage = `url("${IMG(s.file)}")`; dTop.style.backgroundPosition = "0 0"; layer.append(dTop); }
  if (t && t.dockBottom) { dBot = mk("div", "dock bottom"); dBot.style.height = t.dockBottom + "px"; dBot.style.backgroundImage = `url("${IMG(s.file)}")`; dBot.style.backgroundPosition = `0 ${-(H - t.dockBottom)}px`; layer.append(dBot); }

  (FLOW[s.file] || []).forEach(h => {
    let host = canvas, top = h.y;
    if (dTop && h.y + h.h <= t.dockTop) host = dTop;
    else if (dBot && h.y >= H - t.dockBottom) { host = dBot; top = h.y - (H - t.dockBottom); }
    const b = mk("button", "hs");
    b.type = "button";
    b.style.cssText = `left:${h.x}px;top:${top}px;width:${h.w}px;height:${h.h}px`;
    b.title = h.label + (h.to === "@back" ? " (back)" : " → " + byFile.get(h.to).name);
    b.setAttribute("aria-label", b.title);
    b.append(mk("span", "t", h.label));
    b.addEventListener("click", () => go(h.to));
    host.append(b);
  });
  return layer;
}

/* ---------- navigation ---------- */
function go(file, opts = {}) {
  if (file === "@back") return back();
  if (!byFile.has(file)) return console.error("[prototype] unknown screen " + file);
  if (opts.reset) hist = [];
  else if (cur && cur !== file && opts.push !== false) hist.push(cur);
  show(file, opts);
}
function back() {
  if (!hist.length) return toast("Nothing to go back to");
  show(hist.pop());
}
function show(file, opts = {}) {
  const s = byFile.get(file);
  const stage = $("#screen");
  const layer = buildLayer(s);
  if (cur && !opts.instant) layer.classList.add("entering");
  while (stage.children.length > 1) stage.firstChild.remove();
  stage.append(layer);
  if (layer.classList.contains("entering")) {
    void layer.offsetWidth;               // commit opacity:0, then fade in
    layer.classList.remove("entering");
    setTimeout(() => {                     // drop only the layers underneath this one
      let p = layer.previousElementSibling;
      while (p) { const q = p.previousElementSibling; p.remove(); p = q; }
    }, 220);
  }
  else while (layer.previousElementSibling) layer.previousElementSibling.remove();
  cur = file;
  history.replaceState(null, "", "#" + String(s.n).padStart(2, "0"));
  updateChrome();
}
function nextOf(file) {
  if (NEXT[file]) return byFile.get(NEXT[file]);
  const i = indexOf.get(file);
  return i < SCREENS.length - 1 ? SCREENS[i + 1] : null;
}
function step(d) {
  const i = indexOf.get(cur) + d;
  if (i < 0 || i >= SCREENS.length) return;
  go(SCREENS[i].file);
}

/* ---------- chrome ---------- */
function updateChrome() {
  const s = byFile.get(cur);
  $("#btn-back").disabled = !hist.length;
  const t = TALL[cur];
  $("#caption").innerHTML = `<span><b>${String(s.n).padStart(2, "0")}</b> of ${SCREENS.length}</span><span>${esc(s.name)}</span>` + (t ? `<span class="scrolls">↕ scrolls inside the phone</span>` : "");
  const nx = nextOf(cur);
  const nc = $("#nextchip");
  if (nx) { nc.innerHTML = `Next: ${esc(nx.name)}<small>${String(nx.n).padStart(2, "0")} · ${esc(jLabel(nx.journey))}</small>`; nc.onclick = () => go(nx.file); }
  else { const f = SCREENS[0]; nc.innerHTML = `End of the tour — restart<small>Back to ${esc(f.name)}</small>`; nc.onclick = () => go(f.file, { reset: true }); }
  document.querySelectorAll(".jlist button").forEach(b => { if (b.dataset.file === cur) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
  if (s.journey !== lastJourney) { document.querySelectorAll(".journey").forEach(j => j.classList.toggle("open", j.dataset.j === s.journey)); lastJourney = s.journey; }
  const active = $('.jlist button[aria-current="true"]');
  if (active) active.scrollIntoView({ block: "nearest" });
  document.querySelectorAll(".bcard").forEach(c => c.classList.toggle("current", c.dataset.file === cur));
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const jLabel = j => (JOURNEYS.find(x => x[0] === j) || [, j])[1];
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1400); }

function buildRail() {
  const wrap = $("#journeys");
  JOURNEYS.forEach(([key, label]) => {
    const items = SCREENS.filter(s => s.journey === key);
    const j = mk("div", "journey"); j.dataset.j = key;
    const head = mk("div", "jhead");
    const caret = mk("span", "jcaret", "▶");
    const title = mk("div", "jtitle"); title.textContent = label; title.append(mk("small", null, `${items.length} screens`));
    const start = mk("button", "start", "Start"); start.title = `Start at ${items[0].name}`;
    start.addEventListener("click", e => { e.stopPropagation(); go(items[0].file, { reset: true }); });
    head.append(caret, title, start);
    head.addEventListener("click", () => j.classList.toggle("open"));
    const list = mk("ul", "jlist");
    items.forEach(s => {
      const li = mk("li"); const b = mk("button");
      b.dataset.file = s.file; b.append(mk("span", "num", String(s.n).padStart(2, "0")), mk("span", null, s.name));
      b.addEventListener("click", () => go(s.file));
      li.append(b); list.append(li);
    });
    j.append(head, list); wrap.append(j);
  });
}

/* ---------- flow board ---------- */
function buildBoard() {
  const board = $("#board");
  JOURNEYS.forEach(([key, label]) => {
    const items = SCREENS.filter(s => s.journey === key);
    const sec = mk("div", "bj");
    const h = mk("h2", null, label); h.append(mk("small", null, `${items.length} screens · ${String(items[0].n).padStart(2, "0")}–${String(items[items.length - 1].n).padStart(2, "0")}`));
    const row = mk("div", "brow");
    items.forEach(s => {
      const card = mk("div", "bcard"); card.dataset.file = s.file;
      const th = mk("button", "bthumb"); th.title = `Open ${s.name} in the prototype`;
      const im = new Image(); im.src = IMG(s.file); im.alt = s.name; im.draggable = false;
      th.append(im);
      if (TALL[s.file]) th.append(mk("span", "tallbadge", "scrolls ↕"));
      th.addEventListener("click", () => { setMode("proto"); go(s.file, { reset: true }); });
      const nm = mk("div", "bname"); nm.append(mk("span", "num", String(s.n).padStart(2, "0")), mk("span", null, s.name));
      const chips = mk("div", "chips");
      const seen = new Set(); const targets = [];
      (FLOW[s.file] || []).forEach(hs => {
        if (hs.to === "@back" || hs.to === s.file || /^Tab ·/.test(hs.label) || hs.label === "Back" || seen.has(hs.to)) return;
        seen.add(hs.to); targets.push(hs);
      });
      targets.slice(0, 4).forEach(hs => {
        const c = mk("button", "chip", "→ " + byFile.get(hs.to).name); c.title = hs.label;
        c.addEventListener("click", () => { setMode("proto"); go(hs.to, { reset: true }); });
        chips.append(c);
      });
      if (targets.length > 4) chips.append(mk("span", "chip more", `+${targets.length - 4} more`));
      if (!targets.length) chips.append(mk("span", "chip end", "tabs / back only"));
      card.append(th, nm, chips); row.append(card);
    });
    sec.append(h, row); board.append(sec);
  });
}

function setMode(m) {
  mode = m;
  document.body.classList.toggle("mode-board", m === "board");
  $("#m-proto").setAttribute("aria-pressed", m === "proto");
  $("#m-board").setAttribute("aria-pressed", m === "board");
  if (m === "board") { const c = $(".bcard.current"); if (c) c.scrollIntoView({ block: "center", inline: "center" }); }
  else fit();
}
function setHotspots(on) {
  document.body.classList.toggle("hs-on", on);
  $("#btn-hs").setAttribute("aria-pressed", on);
}

/* ---------- scale phone to fit the stage ---------- */
function fit() {
  const st = $("#stage"); if (!st.clientHeight) return;
  const availH = st.clientHeight - 32 - 30, availW = st.clientWidth - 32;
  const scale = Math.max(.35, Math.min(availH / 864, availW / 410, 1.7));
  $("#phone").style.transform = `scale(${scale})`;
  const pb = $("#phonebox"); pb.style.width = 410 * scale + "px"; pb.style.height = 864 * scale + "px";
}
new ResizeObserver(fit).observe($("#stage"));

/* ---------- events ---------- */
$("#m-proto").onclick = () => setMode("proto");
$("#m-board").onclick = () => setMode("board");
$("#btn-back").onclick = back;
$("#btn-hs").onclick = () => setHotspots(!document.body.classList.contains("hs-on"));
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === "h" || k === "H") { setHotspots(!document.body.classList.contains("hs-on")); }
  else if (k === "b" || k === "B") { setMode(mode === "board" ? "proto" : "board"); }
  else if (k === "Escape" || k === "Backspace") { if (mode === "proto") { e.preventDefault(); back(); } else setMode("proto"); }
  else if (k === "ArrowRight" && mode === "proto") { e.preventDefault(); step(1); }
  else if (k === "ArrowLeft" && mode === "proto") { e.preventDefault(); step(-1); }
});

buildRail(); buildBoard(); fit();
const startN = parseInt((location.hash || "").replace("#", ""), 10);
if (location.hash === "#board") setMode("board");
const startScreen = SCREENS.find(s => s.n === startN) || SCREENS[0];
show(startScreen.file, { instant: true });
</script>
